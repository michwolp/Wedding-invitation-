<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#F3EEE4">
<title>לוח אישורי הגעה — מיכל ♥ דביר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
/* same Hebrew fonts as the invitation site */
@font-face{font-family:'Trashim';src:url('/assets/fonts/trashim.woff') format('woff'),url('/assets/fonts/trashim.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:'Hillel';src:url('/assets/fonts/hillel.woff') format('woff'),url('/assets/fonts/hillel.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0590-05FF,U+FB1D-FB4F}
:root{
  --paper:#F3EEE4; --ink:#3A3550; --red:#A83A46; --red-deep:#8A2F3A;
  --blue:#3F5A7A; --blue-soft:#7E93B8; --pink:#B06A86; --gold:#CDB56A;
  --green:#4E7A54; --card:#FBF8F0; --line:#E3DCC9;
  --display:'Trashim', 'Cormorant Garamond', serif; --body:'Hillel', 'PT Serif', serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
h1{font-family:var(--display);font-weight:600;font-size:2.4rem;color:var(--red);
  text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:var(--blue);letter-spacing:.12em;font-size:.9rem;margin:0 0 24px}

.msg{max-width:520px;margin:8vh auto;text-align:center;background:var(--card);
  border:1.5px solid var(--line);border-radius:16px;padding:22px;color:var(--red)}

/* summary cards */
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:0 0 22px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:14px 18px;min-width:120px;text-align:center;flex:1 1 120px}
.card .n{font-family:var(--display);font-weight:600;font-size:2rem;line-height:1;color:var(--red)}
.card .lbl{font-size:.82rem;color:var(--blue);margin-top:4px}
.card .pct{font-size:.8rem;color:var(--pink);margin-top:2px}

.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:14px 18px;margin:0 0 22px}
.panel h2{font-family:var(--display);font-weight:600;font-size:1.5rem;color:var(--red);margin:0 0 10px}

/* four equal-size panels as a 2-per-row grid of squares, each scrolls inside */
.grids{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 22px}
.grids .panel{margin:0;display:flex;flex-direction:column;height:340px}
.grids .panel h2{flex:none}
.grids .scroll{flex:1;min-height:0;overflow:auto}
@media(max-width:640px){.grids{grid-template-columns:1fr}.grids .panel{height:300px}}

/* notes + WhatsApp message lists (inside the grid panels) */
.note-item,.msg-item{padding:8px 2px;border-bottom:1px solid var(--line)}
.note-item:last-child,.msg-item:last-child{border-bottom:none}
.note-who,.msg-who{font-weight:700;font-size:.95rem}
.note-who .ph,.msg-who .when{color:#a99;font-weight:400;font-size:.8rem;margin-inline-start:6px}
.note-who .ph{direction:ltr;unicode-bidi:embed;display:inline-block}
.note-txt{color:#6b6456;font-size:.9rem;margin-top:2px}
.msg-txt{color:var(--pink);font-style:italic;font-size:.9rem;margin-top:2px}
.shuttle-row{display:flex;flex-wrap:wrap;gap:10px 22px}
.shuttle-row{flex-direction:column;gap:8px}
.shuttle-row div{font-size:.98rem;overflow-wrap:anywhere;word-break:break-word}
.shuttle-row .mut{color:#a99;font-size:.85rem}
.shuttle-table{width:100%;border-collapse:collapse;font-size:.9rem}
.shuttle-table th,.shuttle-table td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
.shuttle-table th{color:var(--blue);font-weight:700;font-size:.8rem;position:sticky;top:0;background:var(--card)}
.shuttle-table td.city{text-align:start;font-weight:700}
.shuttle-table b{font-family:var(--display);color:var(--blue);font-size:1.1rem}
.shuttle-table tfoot td{border-top:2px solid var(--line);border-bottom:none;font-weight:700;color:var(--red)}

/* last-5 RSVPs list */
.recent-item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:8px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.recent-item:last-child{border-bottom:none}
.recent-item .who{font-weight:700}
.recent-item .who .full{color:#877f6e;font-size:.82rem;font-weight:400;margin-inline-start:6px}
.recent-item .when{color:#a99;font-size:.82rem}
.recent-item .st{font-size:.8rem;padding:2px 10px;border-radius:99px}
.recent-item .st.yes{background:#eef3ea;color:var(--green)}
.recent-item .st.no{background:#f6ecee;color:var(--red)}

#search{font-family:var(--body);font-size:1rem;padding:10px 14px;width:100%;
  border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:0 0 12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.filters button{font-family:var(--body);font-size:.92rem;padding:7px 16px;cursor:pointer;
  border:1.5px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink)}
.filters button.active{background:var(--red);color:#fff;border-color:var(--red)}
.filters .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.filters button.toggle.active{background:var(--blue);border-color:var(--blue)}

/* collapsible groups + categories (native <details>) */
summary{cursor:pointer;list-style:none;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';display:inline-block;color:var(--blue);
  margin-inline-end:8px;transition:transform .15s;font-size:.85em}
details[open] > summary::before{transform:rotate(90deg)}
html[dir="rtl"] summary::before{content:'◂'}
html[dir="rtl"] details[open] > summary::before{transform:rotate(-90deg)}

.group{margin:0 0 22px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:6px 4px;border-bottom:3px solid var(--line)}
.group-head .grp-name{font-family:var(--display);font-weight:700;font-size:2rem;color:var(--red)}
.group-head .group-sum{font-size:.9rem;color:var(--blue)}
.group-body{padding:8px 0 0 12px}

.cat{margin:0 0 6px;border-bottom:1px solid var(--line)}
.cat > summary{padding:8px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cat > summary .cat-name{font-family:var(--display);font-weight:600;font-size:1.4rem;color:var(--ink)}
.cat > summary .mini{font-size:.85rem;color:var(--blue)}
.cat-body{padding:4px 0 12px 8px}
.grp{margin:8px 0}
.grp > summary{font-size:.92rem;letter-spacing:.06em;font-weight:700;padding:4px 2px}
.grp.g-yes > summary{color:var(--green)} .grp.g-no > summary{color:var(--red)} .grp.g-wait > summary{color:var(--gold)}
.grp > .g{margin-inline-start:6px}
.g{border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:0 0 7px;background:#fff}
.g .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.g .nm{font-weight:700;font-size:1.05rem}
.g .full{color:#877f6e;font-size:.82rem;font-weight:400}
.g .ph{color:#a99;font-size:.8rem;direction:ltr;unicode-bidi:embed}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;margin-inline-start:6px}
.tag.h{background:#eef3ea;color:var(--green)}
.tag.sh{background:#eef1f6;color:var(--blue)}
.tag.wa{background:#f4edf1;color:var(--pink)}
.meta{margin-top:5px;font-size:.86rem;color:#6b6456}
.meta .wa-txt{color:var(--pink);font-style:italic}
.meta .notes{color:var(--ink)}
.empty{color:#aaa;font-size:.85rem;font-style:italic;margin:2px 0}
.hidden{display:none !important}
footer{text-align:center;color:#b3ab99;font-size:.78rem;margin-top:30px}
</style>
</head>
<body>

<div class="wrap" id="app">
  <h1>מיכל ♥ דביר</h1>
  <p class="sub" id="stamp">אישורי הגעה</p>

  <div id="msg" class="msg hidden"></div>

  <div class="cards" id="cards"></div>

  <div class="grids">
    <div class="panel" id="shuttlePanel">
      <h2>הסעות 🚌</h2>
      <div class="shuttle-row scroll" id="shuttle"></div>
    </div>

    <div class="panel" id="recentPanel">
      <h2>10 האישורים האחרונים 🆕</h2>
      <div class="scroll" id="recent"></div>
    </div>

    <div class="panel" id="notesPanel">
      <h2>הערות מהאישורים 📝</h2>
      <div class="scroll" id="notes"></div>
    </div>

    <div class="panel" id="messagesPanel">
      <h2>הודעות וואטסאפ 💬</h2>
      <div class="scroll" id="messages"></div>
    </div>
  </div>

  <input id="search" type="search" placeholder="חיפוש לפי שם או טלפון…" autocomplete="off" />

  <div class="filters" id="filters">
    <button data-f="all" class="active">הכל</button>
    <button data-f="yes">✓ מגיעים</button>
    <button data-f="no">✗ לא מגיעים</button>
    <button data-f="wait">⏳ טרם השיבו</button>
    <span class="sep"></span>
    <button data-t="ride" class="toggle">🚌 עם הסעה</button>
    <button data-t="note" class="toggle">📝 עם הערה</button>
  </div>

  <div id="roster"></div>

  <footer>מתעדכן בזמן אמת · קריאה בלבד</footer>
</div>

<script type="module">
import {
  summaryCardsHtml, recentHtml, shuttleRowsHtml, rosterHtml,
  notesHtml, messagesHtml, passesCard,
} from '/dashboard-view.js';

const $ = (s, r = document) => r.querySelector(s);

// Paint the whole dashboard from the roster payload. Panels with no data hide.
function render(data){
  const c = data.counts || {};
  $('#cards').innerHTML = summaryCardsHtml(c);

  const rec = recentHtml(data.recent);
  if (rec) $('#recent').innerHTML = rec; else $('#recentPanel').classList.add('hidden');

  $('#shuttle').innerHTML = shuttleRowsHtml(c.shuttle);
  if (!(c.shuttle && c.shuttle.totalHeads > 0)) $('#shuttlePanel').classList.add('hidden');

  const notes = notesHtml(data.notes);
  if (notes) $('#notes').innerHTML = notes; else $('#notesPanel').classList.add('hidden');

  const inbox = messagesHtml(data.inbox);
  if (inbox) $('#messages').innerHTML = inbox; else $('#messagesPanel').classList.add('hidden');

  $('#roster').innerHTML = rosterHtml(data);
}

// --- filtering ---------------------------------------------------------------
let statusFilter = 'all';   // all | yes | no | wait
let rideFilter = false;     // only guests with a shuttle
let noteFilter = false;     // only guests with a note
let searchText = '';

// Which status bucket a card sits in, read from its parent <details class="grp g-*">.
function cardStatus(el){
  const grp = el.closest('.grp');
  if (!grp) return '';
  if (grp.classList.contains('g-yes')) return 'yes';
  if (grp.classList.contains('g-no')) return 'no';
  if (grp.classList.contains('g-wait')) return 'wait';
  return '';
}

function applyFilters(){
  const q = searchText.trim().toLowerCase();
  const filters = { status: statusFilter, ride: rideFilter, note: noteFilter, q };
  const active = !!q || statusFilter !== 'all' || rideFilter || noteFilter;
  const hasVisible = (el) => [...el.querySelectorAll('.g')].some(g => !g.classList.contains('hidden'));

  // show/hide each guest card via the pure predicate
  document.querySelectorAll('#roster .g').forEach(el => {
    const card = {
      status: cardStatus(el),
      ride: el.dataset.ride === '1',
      note: el.dataset.note === '1',
      s: el.dataset.s || '',
    };
    el.classList.toggle('hidden', !passesCard(card, filters));
  });
  // hide containers that ended up empty — dropdowns stay closed by default either way
  document.querySelectorAll('#roster details.grp').forEach(el =>
    el.classList.toggle('hidden', !hasVisible(el)));
  document.querySelectorAll('#roster details.cat').forEach(el =>
    el.classList.toggle('hidden', active && !hasVisible(el)));
  document.querySelectorAll('#roster details.group').forEach(el =>
    el.classList.toggle('hidden', active && !hasVisible(el)));
}

// --- data load ---------------------------------------------------------------
function showMsg(text){
  const m = $('#msg');
  m.textContent = text;
  m.classList.remove('hidden');
  ['#cards','#recentPanel','#shuttlePanel','#notesPanel','#messagesPanel','#search','#filters','#roster']
    .forEach(s => $(s).classList.add('hidden'));
}

async function load(key){
  const res = await fetch('/api/rsvp-list?key=' + encodeURIComponent(key));
  if (res.status === 404 || res.status === 401) throw new Error('קישור לא תקין — אין הרשאה');
  if (!res.ok) throw new Error('שגיאת שרת (' + res.status + ')');
  return res.json();
}

$('#search').addEventListener('input', e => { searchText = e.target.value; applyFilters(); });
$('#filters').addEventListener('click', e => {
  const f = e.target.closest('button[data-f]');
  const t = e.target.closest('button[data-t]');
  if (f){
    statusFilter = f.dataset.f;
    document.querySelectorAll('#filters button[data-f]').forEach(b => b.classList.toggle('active', b === f));
  } else if (t){
    t.classList.toggle('active');
    const on = t.classList.contains('active');
    if (t.dataset.t === 'ride') rideFilter = on;
    else if (t.dataset.t === 'note') noteFilter = on;
  } else return;
  applyFilters();
});

// The access key travels in the URL (hash or ?k=) so no password is typed.
// Remember it for this browser session so a later visit without the hash works.
(async () => {
  let key = '';
  const hash = (location.hash || '').replace(/^#/, '').trim();
  const qp = new URLSearchParams(location.search).get('k');
  if (hash) key = hash;
  else if (qp) key = qp.trim();
  else { try { key = sessionStorage.getItem('dk') || ''; } catch {} }

  if (!key) { showMsg('פתחו את הקישור המלא שקיבלתם (עם הסיומת אחרי #) כדי לראות את הלוח.'); return; }

  try {
    const data = await load(key);
    render(data);
    try { sessionStorage.setItem('dk', key); } catch {}
    // scrub the key out of the visible address bar once it's stored
    if (location.hash || location.search) {
      try { history.replaceState(null, '', location.pathname); } catch {}
    }
  } catch (e) {
    try { sessionStorage.removeItem('dk'); } catch {}
    showMsg(e.message || 'שגיאה');
  }
})();
</script>
</body>
</html>
