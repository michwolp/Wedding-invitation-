<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#F3EEE4">
<title>לוח אישורי הגעה — מיכל ♥ דביר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
/* same Hebrew fonts as the invitation site */
@font-face{font-family:'Trashim';src:url('/assets/fonts/trashim.woff') format('woff'),url('/assets/fonts/trashim.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;unicode-range:U+0590-05FF,U+FB1D-FB4F}
@font-face{font-family:'Hillel';src:url('/assets/fonts/hillel.woff') format('woff'),url('/assets/fonts/hillel.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0590-05FF,U+FB1D-FB4F}
:root{
  --paper:#F3EEE4; --ink:#3A3550; --red:#A83A46; --red-deep:#8A2F3A;
  --blue:#3F5A7A; --blue-soft:#7E93B8; --pink:#B06A86; --gold:#CDB56A;
  --green:#4E7A54; --card:#FBF8F0; --line:#E3DCC9;
  --display:'Trashim', 'Cormorant Garamond', serif; --body:'Hillel', 'PT Serif', serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
h1{font-family:var(--display);font-weight:600;font-size:2.4rem;color:var(--red);
  text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:var(--blue);letter-spacing:.12em;font-size:.9rem;margin:0 0 24px}

.msg{max-width:520px;margin:8vh auto;text-align:center;background:var(--card);
  border:1.5px solid var(--line);border-radius:16px;padding:22px;color:var(--red)}

/* summary cards */
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:0 0 22px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:14px 18px;min-width:120px;text-align:center;flex:1 1 120px}
.card .n{font-family:var(--display);font-weight:600;font-size:2rem;line-height:1}
.card .lbl{font-size:.82rem;color:var(--blue);margin-top:4px}
.card .pct{font-size:.8rem;color:var(--pink);margin-top:2px}
.card.yes .n{color:var(--green)} .card.no .n{color:var(--red)}
.card.wait .n{color:var(--gold)} .card.heads .n{color:var(--blue)}

.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:14px 18px;margin:0 0 22px}
.panel h2{font-family:var(--display);font-weight:600;font-size:1.5rem;color:var(--red);margin:0 0 10px}
.shuttle-row{display:flex;flex-wrap:wrap;gap:10px 22px}
.shuttle-row div{font-size:.95rem}
.shuttle-row b{font-family:var(--display);font-size:1.2rem;color:var(--blue)}

#search{font-family:var(--body);font-size:1rem;padding:10px 14px;width:100%;
  border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:0 0 20px}

/* collapsible groups + categories (native <details>) */
summary{cursor:pointer;list-style:none;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';display:inline-block;color:var(--blue);
  margin-inline-end:8px;transition:transform .15s;font-size:.85em}
details[open] > summary::before{transform:rotate(90deg)}
html[dir="rtl"] summary::before{content:'◂'}
html[dir="rtl"] details[open] > summary::before{transform:rotate(-90deg)}

.group{margin:0 0 22px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:6px 4px;border-bottom:3px solid var(--line)}
.group-head .grp-name{font-family:var(--display);font-weight:700;font-size:2rem;color:var(--red)}
.group-head .group-sum{font-size:.9rem;color:var(--blue)}
.group-body{padding:8px 0 0 12px}

.cat{margin:0 0 6px;border-bottom:1px solid var(--line)}
.cat > summary{padding:8px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cat > summary .cat-name{font-family:var(--display);font-weight:600;font-size:1.4rem;color:var(--ink)}
.cat > summary .mini{font-size:.85rem;color:var(--blue)}
.cat-body{padding:4px 0 12px 8px}
.grp{margin:10px 0}
.grp h3{font-size:.9rem;letter-spacing:.08em;margin:0 0 6px;text-transform:uppercase}
.grp.g-yes h3{color:var(--green)} .grp.g-no h3{color:var(--red)} .grp.g-wait h3{color:var(--gold)}
.g{border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:0 0 7px;background:#fff}
.g .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.g .nm{font-weight:700;font-size:1.05rem}
.g .full{color:#877f6e;font-size:.82rem;font-weight:400}
.g .ph{color:#a99;font-size:.8rem;direction:ltr;unicode-bidi:embed}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;margin-inline-start:6px}
.tag.h{background:#eef3ea;color:var(--green)}
.tag.sh{background:#eef1f6;color:var(--blue)}
.tag.wa{background:#f4edf1;color:var(--pink)}
.meta{margin-top:5px;font-size:.86rem;color:#6b6456}
.meta .wa-txt{color:var(--pink);font-style:italic}
.meta .notes{color:var(--ink)}
.empty{color:#aaa;font-size:.85rem;font-style:italic;margin:2px 0}
.hidden{display:none !important}
footer{text-align:center;color:#b3ab99;font-size:.78rem;margin-top:30px}
</style>
</head>
<body>

<div class="wrap" id="app">
  <h1>מיכל ♥ דביר</h1>
  <p class="sub" id="stamp">אישורי הגעה</p>

  <div id="msg" class="msg hidden"></div>

  <div class="cards" id="cards"></div>

  <div class="panel" id="shuttlePanel">
    <h2>הסעות 🚌</h2>
    <div class="shuttle-row" id="shuttle"></div>
  </div>

  <input id="search" type="search" placeholder="חיפוש לפי שם או טלפון…" autocomplete="off" />

  <div id="roster"></div>

  <footer>מתעדכן בזמן אמת · קריאה בלבד</footer>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CITY = { tlv: 'תל אביב', rhv: 'ראשל״צ' };
const RET  = { after: 'חזרה אחרי האפטר', noafter: 'חזרה לפני האפטר' };

function shuttleText(sh){
  if (!sh) return '';
  const parts = [];
  if (sh.city) parts.push(CITY[sh.city] || sh.city);
  if (sh.to) parts.push('הסעה להגעה');
  if (sh.ret) parts.push(RET[sh.ret] || sh.ret);
  return parts.join(' · ');
}

function guestCard(g, kind){
  const tags = [];
  if (kind === 'yes'){
    tags.push(`<span class="tag h">${g.heads} ${g.heads === 1 ? 'אורח' : 'אורחים'}</span>`);
    if (g.shuttle) tags.push(`<span class="tag sh">🚌 ${esc(shuttleText(g.shuttle))}</span>`);
  }
  if (g.reply) tags.push(`<span class="tag wa">💬 הגיב/ה</span>`);
  const meta = [];
  if (kind === 'yes' && (g.adults || g.children)){
    meta.push(`<span>מבוגרים: ${g.adults||0}${g.children ? ` · ילדים: ${g.children}` : ''}</span>`);
  }
  if (g.notes) meta.push(`<span class="notes">📝 ${esc(g.notes)}</span>`);
  if (g.reply && g.reply.text) meta.push(`<span class="wa-txt">💬 «${esc(g.reply.text)}»</span>`);
  const full = (g.fullName && g.fullName !== g.name) ? ` <span class="full">${esc(g.fullName)}</span>` : '';
  return `<div class="g" data-s="${esc((g.name+' '+(g.fullName||'')+' '+g.phone).toLowerCase())}">
    <div class="top"><span><span class="nm">${esc(g.name)}</span>${full}</span>
      <span>${tags.join('')}</span></div>
    <div class="top"><span class="ph">${esc(g.phone)}</span></div>
    ${meta.length ? `<div class="meta">${meta.join(' &nbsp;·&nbsp; ')}</div>` : ''}
  </div>`;
}

function render(data){
  // summary cards
  const c = data.counts, p = c.pct || {};
  $('#cards').innerHTML = [
    ['heads', c.heads, `${c.adults} מבוגרים · ${c.children} ילדים`, 'סה״כ נפשות מגיעות', ''],
    ['yes', c.yes, `${p.yes}% מכלל האורחים`, 'אישרו הגעה', ''],
    ['no', c.no, `${p.no}% מכלל האורחים`, 'לא מגיעים', ''],
    ['wait', c.noResponse, `${p.noResponse}% מכלל האורחים`, 'טרם השיבו', ''],
    ['', c.totalGuests, `${c.responded} השיבו (${p.responded}%)`, 'סה״כ אורחים ברשימה', ''],
  ].map(([cls,n,pct,lbl]) =>
    `<div class="card ${cls}"><div class="n">${n}</div><div class="lbl">${lbl}</div><div class="pct">${pct}</div></div>`
  ).join('');

  // shuttle
  const s = c.shuttle || {};
  const byCity = Object.entries(s.byCity || {}).map(([city, v]) =>
    `<div>${CITY[city] || city}: <b>${v.heads}</b> נפשות</div>`).join('');
  $('#shuttle').innerHTML = `
    <div>סה״כ בהסעות: <b>${s.totalHeads || 0}</b> נפשות</div>
    <div>הסעה להגעה: <b>${s.to || 0}</b></div>
    <div>${RET.after}: <b>${s.retAfter || 0}</b></div>
    <div>${RET.noafter}: <b>${s.retNoAfter || 0}</b></div>
    ${byCity}`;
  if (!(s.totalHeads > 0)) $('#shuttlePanel').classList.add('hidden');

  // group everyone: top-level group → fine category → yes/no/wait buckets
  const GROUP_ORDER = ['משפחה', 'חברים', 'עבודה', 'אחר'];
  const groups = {};
  const bucket = (arr, kind) => arr.forEach(g => {
    const gr = g.group || 'אחר';
    const cat = g.category || 'אחר';
    const G = groups[gr] = groups[gr] || {};
    (G[cat] = G[cat] || { yes: [], no: [], wait: [] })[kind].push(g);
  });
  bucket(data.accepted, 'yes');
  bucket(data.declined, 'no');
  bucket(data.noResponse, 'wait');

  const orphanHtml = (data.orphans && data.orphans.length)
    ? `<div class="cat"><h2>אישורים ללא התאמה לרשימה <span class="mini">${data.orphans.length}</span></h2>` +
      data.orphans.map(o => `<div class="g" data-s="${esc((o.display_name+' '+o.phone).toLowerCase())}">
        <div class="top"><span class="nm">${esc(o.display_name || '—')}</span>
          <span><span class="tag ${o.attending==='yes'?'h':''}">${o.attending==='yes'?'אישר':'לא מגיע'}</span></span></div>
        <div class="top"><span class="ph">${esc(o.phone)}</span></div>
        ${o.notes ? `<div class="meta notes">📝 ${esc(o.notes)}</div>` : ''}
      </div>`).join('') + `</div>`
    : '';

  const catBlock = (cat, b) => {
    const grp = (kind, title, cls) => b[kind].length
      ? `<div class="grp ${cls}"><h3>${title} (${b[kind].length})</h3>${b[kind].map(g => guestCard(g, kind)).join('')}</div>`
      : '';
    const total = b.yes.length + b.no.length + b.wait.length;
    return `<details class="cat">
      <summary><span class="cat-name">${esc(cat)}</span>
        <span class="mini">${b.yes.length} ✓ · ${b.no.length} ✗ · ${b.wait.length} ⏳ · מתוך ${total}</span></summary>
      <div class="cat-body">
        ${grp('yes','אישרו הגעה','g-yes')}
        ${grp('no','לא מגיעים','g-no')}
        ${grp('wait','טרם השיבו','g-wait')}
      </div>
    </details>`;
  };

  const ordered = [...GROUP_ORDER.filter(g => groups[g]),
                   ...Object.keys(groups).filter(g => !GROUP_ORDER.includes(g)).sort()];
  const groupHtml = ordered.map(gr => {
    const cats = groups[gr];
    let gy = 0, gn = 0, gw = 0, gh = 0;
    const inner = Object.keys(cats).sort().map(cat => {
      const b = cats[cat];
      gy += b.yes.length; gn += b.no.length; gw += b.wait.length;
      gh += b.yes.reduce((n, g) => n + (g.heads || 0), 0);
      return catBlock(cat, b);
    }).join('');
    return `<details class="group" open>
      <summary class="group-head"><span class="grp-name">${esc(gr)}</span>
        <span class="group-sum">${gy} ✓ · ${gn} ✗ · ${gw} ⏳ &nbsp;·&nbsp; ${gh} נפשות</span></summary>
      <div class="group-body">${inner}</div>
    </details>`;
  }).join('');

  $('#roster').innerHTML = groupHtml + orphanHtml;
}

function filter(q){
  q = q.trim().toLowerCase();
  const searching = !!q;
  document.querySelectorAll('#roster .g').forEach(el => {
    el.classList.toggle('hidden', searching && !(el.dataset.s || '').includes(q));
  });
  const hasVisible = (el) => [...el.querySelectorAll('.g')].some(g => !g.classList.contains('hidden'));
  document.querySelectorAll('#roster .grp').forEach(el => el.classList.toggle('hidden', !hasVisible(el)));
  // categories: default collapsed; while searching, hide empties and open matches
  document.querySelectorAll('#roster details.cat').forEach(el => {
    const any = hasVisible(el);
    el.classList.toggle('hidden', searching && !any);
    el.open = searching ? any : false;
  });
  // groups stay open by default; while searching, hide empties
  document.querySelectorAll('#roster details.group').forEach(el => {
    const any = hasVisible(el);
    el.classList.toggle('hidden', searching && !any);
    el.open = true;
  });
}

function showMsg(text){
  const m = $('#msg');
  m.textContent = text;
  m.classList.remove('hidden');
  ['#cards','#shuttlePanel','#search','#roster'].forEach(s => $(s).classList.add('hidden'));
}

async function load(key){
  const res = await fetch('/api/rsvp-list?key=' + encodeURIComponent(key));
  if (res.status === 404 || res.status === 401) throw new Error('קישור לא תקין — אין הרשאה');
  if (!res.ok) throw new Error('שגיאת שרת (' + res.status + ')');
  return res.json();
}

$('#search').addEventListener('input', e => filter(e.target.value));

// The access key travels in the URL (hash or ?k=) so no password is typed.
// Remember it for this browser session so a later visit without the hash works.
(async () => {
  let key = '';
  const hash = (location.hash || '').replace(/^#/, '').trim();
  const qp = new URLSearchParams(location.search).get('k');
  if (hash) key = hash;
  else if (qp) key = qp.trim();
  else { try { key = sessionStorage.getItem('dk') || ''; } catch {} }

  if (!key) { showMsg('פתחו את הקישור המלא שקיבלתם (עם הסיומת אחרי #) כדי לראות את הלוח.'); return; }

  try {
    const data = await load(key);
    render(data);
    try { sessionStorage.setItem('dk', key); } catch {}
    // scrub the key out of the visible address bar once it's stored
    if (location.hash || location.search) {
      try { history.replaceState(null, '', location.pathname); } catch {}
    }
  } catch (e) {
    try { sessionStorage.removeItem('dk'); } catch {}
    showMsg(e.message || 'שגיאה');
  }
})();
</script>
</body>
</html>
